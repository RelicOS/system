# RelicOS: RetroArch user state (M14). Seeded once by S00storage into
# /data/retroarch/; RetroArch rewrites this whole file on every exit
# (config_save_on_exit). Product defaults come from
# /usr/share/relicos/retroarch/relicos.cfg, appended after this file and
# winning on every key it defines. This file survives updates.
config_save_on_exit = "true"
