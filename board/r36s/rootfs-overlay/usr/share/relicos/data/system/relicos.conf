# RelicOS settings (M22). Written by the menu (NETWORK SETTINGS, BLUETOOTH)
# and by relicos-wifi / relicos-bluetooth; read by both at boot. One key
# per line. Seeded once into /data/system on the first boot, never
# overwritten by an update. Both radios start off: nothing here costs
# battery until the player asks for it.
wifi.enabled=0
wifi.ssid=
wifi.key=
controllers.bluetooth.enabled=0
