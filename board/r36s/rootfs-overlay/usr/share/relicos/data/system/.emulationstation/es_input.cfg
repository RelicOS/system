<?xml version="1.0"?>
<!-- RelicOS: the ES's controller map, seeded EMPTY into /data (M14).
     Until M13 this file carried a hand-written entry for adc-joystick,
     because the sticks were their own button-less SDL joystick and the
     ES's configurator (which selects a device by a button press) could
     not reach them. Since M14 relicos-joypad fuses gpio-keys and
     adc-joystick into one uinput device, "RelicOS Gamepad" (see
     package/relicos-joypad). SDL2 recognises it as a game controller
     (it has BTN_GAMEPAD) and builds the whole mapping itself -- a/b/x/y,
     d-pad, shoulders, thumbs, both sticks -- and the ES writes the
     resulting entry into THIS file on first sight (InputManager,
     loadFromSdlMapping). The file exists so that write lands on the
     journaled side; nothing is seeded because the GUID embeds a CRC of
     the device name that is not worth computing by hand. -->
<inputList>
</inputList>
