<?xml version="1.0"?>
<!-- RelicOS system list, seeded into /data on first boot (S00storage).
     The ES discards any system with zero matching files and errors out
     with none left; ROMs live on the RELIC partition (/relic/roms/<name>),
     where a PC can write them.

     dummy (M10): one .txt shipped on RELIC, "launched" with /bin/true --
     the launch/return cycle as a free observation. Kept for now.

     gb (M14): the first real system. <command> hands the core name and
     the ROM to /usr/bin/relicos-launch, which runs RetroArch with the two
     config layers (see the script). The core is spelled here rather than
     in an <emulators> block: nothing consumes the ES's emulator/core menus
     yet; when a second core arrives, the command= attribute on <core> is
     the way to keep one command per core. %ROM% arrives shell-escaped. -->
<systemList>
  <system>
    <name>dummy</name>
    <fullname>RelicOS M10 test system</fullname>
    <path>/relic/roms/dummy</path>
    <extension>.txt</extension>
    <command>/bin/true</command>
    <platform>pc</platform>
    <theme>default</theme>
  </system>
  <system>
    <name>gb</name>
    <fullname>Game Boy</fullname>
    <path>/relic/roms/gb</path>
    <extension>.gb .gbc .GB .GBC</extension>
    <command>/usr/bin/relicos-launch gambatte %ROM%</command>
    <platform>gb</platform>
    <theme>gb</theme>
  </system>
</systemList>
