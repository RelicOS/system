<?xml version="1.0"?>
<!-- RelicOS first-boot seed (M16). The ES rewrites this file whole whenever
     a setting changes, so only values that differ from its defaults survive
     here -- which is exactly what a seed should carry.

     ThemeSet: the ES builds its loading screen (es-core Splash.cpp) before
     any system is loaded, and picks the theme's splash.xml only if this
     setting already names the theme. With the setting empty (the default)
     it draws its built-in Batocera splash on every boot, and "relicos" is
     only written back when the user saves some other setting. Naming it
     here also pins the default against a user theme in /relic/themes that
     sorts before "relicos" (the ES otherwise takes the first in order). -->
<config>
	<string name="ThemeSet" value="relicos" />
</config>
