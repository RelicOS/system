# RelicOS RetroArch product defaults (M14). Passed with --appendconfig by
# /usr/bin/relicos-launch AFTER the user's /data/retroarch/retroarch.cfg,
# so every key here wins; keys not here are the user's (or RetroArch's
# defaults). Lives on the immutable rootfs: versioned with the system,
# replaced by an update, never written by RetroArch. Note for updates: a
# key REMOVED from here later stays in the user's file with its last
# value (RetroArch saved the merged config on exit).

# --- drivers: the M9/M10 stack, no display server -----------------------
video_driver = "gl"                  # gl2 flavour = GLES2 (--enable-opengles), what the ES uses on Panfrost
video_context_driver = "kms"         # GBM + EGL straight on /dev/dri; the ES released DRM master before launching us
video_fullscreen = "true"            # KMS has no windows; the panel is 640x480
video_refresh_rate = "77.669907"     # THE panel mode (DTS "M ... default=1"). The DTS also carries ten
                                     # inherited 50/60/90/120 Hz variants never measured on this unit;
                                     # RetroArch picks the mode nearest this value, and the 60 Hz one
                                     # distorts the picture here (M14 obs. 3). Pinned to the native mode;
                                     # a true 60 Hz mode for this glass is a display-milestone seed.
video_vsync = "true"                 # panel ~77 Hz (M9), core ~60: audio_sync rides on top; off = the A/B if it stutters
video_threaded = "false"             # one variable at a time; the A/B after vsync
video_smooth = "false"               # pixel art: nearest neighbour
aspect_ratio_index = "22"            # core provided (GB 160x144 = 10:9)
video_scale_integer = "true"         # 3x = 480x432, no shimmer; "false" (533x480) is the product A/B
audio_driver = "alsathread"          # audio written from its own thread (ArkOS lineage); "alsa" is the A/B
audio_device = "default"             # /etc/asound.conf: plug -> dmix at 48 kHz (M13)
audio_out_rate = "48000"             # = the dmix slave rate: one resampling, in RetroArch
audio_latency = "64"                 # Batocera's value; a number, not a guess
input_driver = "udev"                # keyboards by ID_INPUT_KEY: gpio-keys-vol (VOL+/-)
input_joypad_driver = "udev"         # joypads by ID_INPUT_JOYSTICK=1: only the fused RelicOS Gamepad
input_autodetect_enable = "false"    # binds below are authoritative; no profile scan, no "not configured" OSD
menu_driver = "rgui"                 # the text menu: no assets, no fonts; the product menu is the ES
rgui_show_start_screen = "false"

# --- where things live (the rootfs is erofs: only /usr may be read) -----
libretro_directory = "/usr/lib/libretro"
system_directory = "/relic/bios"                 # BIOS files the user drops from a PC (GB needs none)
savefile_directory = "/relic/saves"
savestate_directory = "/relic/saves"
sort_savefiles_by_content_enable = "true"        # -> /relic/saves/gb/<rom>.srm   (ROM folder = ES system name,
sort_savestates_by_content_enable = "true"       # -> /relic/saves/gb/<rom>.state  where the ES's save-state repository looks)
sort_savefiles_enable = "false"                  # RetroArch's default (true) nests a core-name folder on top:
sort_savestates_enable = "false"                 # /relic/saves/gb/Gambatte/... (M14 obs. 3). One level, the system's.
screenshot_directory = "/relic/screenshots"
core_options_path = "/data/retroarch/retroarch-core-options.cfg"
log_dir = "/data/retroarch/logs"
log_to_file = "true"                             # a copy of --verbose on /data, next to the serial
cache_directory = "/tmp"                         # archive extraction (unused this milestone)
config_save_on_exit = "true"                     # rewrites /data/retroarch/retroarch.cfg -- the persistence rung

# --- the pad: RelicOS Gamepad (relicos-joypad) --------------------------
# Indices are the udev joypad driver's: ascending evdev code, buttons from
# BTN_MISC up, axes from ABS_X up. Nintendo layout (M7): A = BTN_EAST,
# B = BTN_SOUTH, X = BTN_NORTH, Y = BTN_WEST. Both sticks are already
# oriented in the DTS (M8): falling = left/up, so minus = left/up here.
input_player1_joypad_index = "0"
input_player1_b_btn = "0"        # BTN_SOUTH
input_player1_a_btn = "1"        # BTN_EAST
input_player1_x_btn = "2"        # BTN_NORTH
input_player1_y_btn = "3"        # BTN_WEST
input_player1_l_btn = "4"        # BTN_TL
input_player1_r_btn = "5"        # BTN_TR
input_player1_l2_btn = "6"       # BTN_TL2
input_player1_r2_btn = "7"       # BTN_TR2
input_player1_select_btn = "8"   # BTN_SELECT
input_player1_start_btn = "9"    # BTN_START
input_player1_l3_btn = "11"      # BTN_THUMBL   (10 is BTN_MODE = FN, the menu button below)
input_player1_r3_btn = "12"      # BTN_THUMBR
input_player1_up_btn = "13"      # BTN_DPAD_UP
input_player1_down_btn = "14"    # BTN_DPAD_DOWN
input_player1_left_btn = "15"    # BTN_DPAD_LEFT
input_player1_right_btn = "16"   # BTN_DPAD_RIGHT
input_player1_l_x_minus_axis = "-0"   # ABS_X
input_player1_l_x_plus_axis = "+0"
input_player1_l_y_minus_axis = "-1"   # ABS_Y
input_player1_l_y_plus_axis = "+1"
input_player1_r_x_minus_axis = "-2"   # ABS_RX
input_player1_r_x_plus_axis = "+2"
input_player1_r_y_minus_axis = "-3"   # ABS_RY
input_player1_r_y_plus_axis = "+3"
input_player1_analog_dpad_mode = "0"  # the stick does not emulate the d-pad (product decision later)

# --- leaving the game, and the bench -----------------------------------
# No input_enable_hotkey_btn on purpose: a modifier would gate the volume
# keys too and delay the game's own SELECT (hotkey_block_delay). Exit is a
# RetroPad combo, the menu is FN (not a game button), volume is bare.
input_quit_gamepad_combo = "4"        # 4 = Start + Select -> exit -> back to the ES
quit_press_twice = "false"            # default true would eat the first Start+Select
input_menu_toggle_btn = "10"          # FN (BTN_MODE) opens RGUI
input_volume_up = "volumeup"          # KEY_VOLUMEUP on gpio-keys-vol (RetroArch's digital gain, with OSD)
input_volume_down = "volumedown"
fps_show = "true"                     # bench of the milestone: the core's frame rate on screen; product turns it off
savestate_auto_save = "false"
savestate_auto_load = "false"
