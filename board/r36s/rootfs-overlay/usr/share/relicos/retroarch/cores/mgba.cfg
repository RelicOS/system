# RelicOS per-core defaults: mGBA (Game Boy Advance), M20.
# Read by relicos-launch AFTER relicos.cfg (--appendconfig a|b, last file
# wins), so every key here beats the product default for this core only.

# --- why this core does not use the KMS video driver --------------------
# ✅ device (M20 obs. 5/6): with the product's video_driver = "gl" +
# video_context_driver = "kms", the GBA never started -- RetroArch died in
# video_driver_init_internal() with "[KMS] Error when switching mode."
#
# The chain, read from the logs and the sources:
#   1. mGBA calls SET_SYSTEM_AV_INFO from inside retro_load_game (240x160,
#      59.73 Hz). None of the other five cores of the shelf does that.
#   2. RetroArch only skips a video reinit when max_width/max_height are
#      unchanged (runloop.c); coming from zero they are not, so it brings
#      the video driver up right there, mid-load.
#   3. After the load the normal path initialises video a SECOND time, and
#      the KMS context cannot survive that: gfx_ctx_drm_init() calls
#      drmSetMaster(g_drm_fd) eighteen lines BEFORE g_drm_fd is assigned
#      the freshly opened fd (drm_ctx.c), so the new fd never becomes DRM
#      master and drmModeSetCrtc returns EACCES. On the FIRST init of a
#      process this is invisible: g_drm_fd is -1, the call is a no-op, and
#      the fd is master implicitly because nothing else holds it (the ES
#      dropped it before launching us, M14).
#
# The SDL2 driver survives the same double init -- proven on the device,
# the log shows "[SDL2] Available renderers" twice and the game running at
# 60 fps -- because SDL tears its own video subsystem down completely.
# SDL2 here is the same KMSDRM build the menu has rendered on since M10.
#
# So this is a workaround for a RetroArch defect, scoped to the one core
# that triggers it, on the layer built for exactly this. The fix upstream
# is drmSetMaster(fd); a patch of ours is the alternative if the SDL2 path
# ever costs something measurable. video_context_driver is emptied because
# the sdl2 driver brings its own; this is the exact pair the bench proved.
video_driver = "sdl2"
video_context_driver = ""

# --- the screen ---------------------------------------------------------
# The GBA is 240x160 and the panel is 640x480. relicos.cfg pins
# video_scale_integer = "true", which is right for every other console of
# the shelf (SNES 256x224 -> 2x = 512x448, Mega Drive 320x224 -> 2x =
# 640x448, NES 256x240 -> 2x = 512x480), but here the next whole multiple,
# 3x, is 720x480 -- wider than the panel -- so integer scaling falls back
# to 2x = 480x320 and leaves a third of the screen black. Off, the picture
# fills the height at the core's own aspect (640x427).
video_scale_integer = "false"
