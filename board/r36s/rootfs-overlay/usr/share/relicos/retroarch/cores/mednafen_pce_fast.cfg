# Beetle PCE Fast (M23): no "Mode Switch" on the pads.
#
# The core toggles a pad between 2 and 6 buttons when RetroPad L2 is
# pressed (mednafen/pce_fast/input.c, bit 0x1000), and a 2-button game
# reads a 6-button pad as a direction held: observed on the device in
# Bomberman '94, player 2 on the handheld -- whose L2 is a real shoulder
# button, easy to touch -- walking up for the rest of the round. The PC
# Engine pad has no L2, so the bind is neutralised for every player; the
# 6-button pad the few games want is the core option
# pce_fast_default_joypad_type_p<n>, per game, not a button. This file
# is appended after the pad layer on purpose (relicos-launch).
input_player1_l2_btn = "nul"
input_player1_l2_axis = "nul"
input_player2_l2_btn = "nul"
input_player2_l2_axis = "nul"
input_player3_l2_btn = "nul"
input_player3_l2_axis = "nul"
input_player4_l2_btn = "nul"
input_player4_l2_axis = "nul"
input_player5_l2_btn = "nul"
input_player5_l2_axis = "nul"
