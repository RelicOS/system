<?xml version="1.0"?>
<!-- RelicOS system list. The ES discards any system with zero matching
     files and errors out with none left; ROMs live on the RELICOS
     partition (/relicos/roms/<name>), where a PC can write them.

     M25 - this file is the PRODUCT's, so it lives on the immutable rootfs
     and an update replaces it. From M12 to M25 it was seeded into /data
     on the first boot and never touched again (seed-if-absent is the
     contract for the USER's files), which meant a bundle adding a console
     could not change the menu of a card that already had one. The ES
     looks here last (SystemData::getConfigPath): first
     ~/.emulationstation/es_systems_custom.cfg, then ~/.emulationstation/
     es_systems.cfg (both on /data -- the user's escape hatch, never
     shipped), then this directory, the executable's own
     (Paths::getEmulationStationPath is argv[0]'s directory, like
     emulationstation.ini next to it). S00storage renames the copy the
     older images seeded so this one is found.

     M20 - the shelf. One <system> per console and ONE core each: the
     reference distros (KNULLI, batocera, ArkOS) ship a single default per
     system too, and only override it where the hardware is weak. This
     image serves one device and has no core downloader, so a second core
     would be permanent weight and a question the player should not be
     asked. The ES of this lineage reads <emulators><core command="...">,
     so a second one can be added later without changing this shape.

     Three names per system, and they are not interchangeable:
       <name>      the folder under /relicos/roms and /relicos/saves
       <theme>     the file the theme looks for (art/logos/<theme>.svg)
       <platform>  the ES's own id, used for scraping metadata
     They agree everywhere except WonderSwan, where the theme's logo is
     wswan.svg and the ES's platform id is wonderswan.

     <command> hands the core name and the ROM to /usr/bin/relicos-launch,
     which runs RetroArch with the config layers (see the script). %ROM%
     arrives shell-escaped. %CONTROLLERSCONFIG% (M23) is the ES's player
     order -- "-p1index N -p1guid G -p1path /dev/input/eventN -p1name
     ..." per configured pad, player 1 first -- which the launcher turns
     into RetroArch's pad slots and binds (relicos-pads); without it a
     pad that is not the handheld's own has no binds in a game.
     Extensions are case-sensitive here, hence the upper-case twins.

     The M10 dummy system is gone (M20): fourteen real systems exercise
     the launch/return cycle better than /bin/true did. Its roms/dummy
     folder left the image with it -- a folder for a system the menu no
     longer has is clutter on the one partition the user actually looks
     at. A card that already has it keeps it: S00storage creates folders
     and never deletes on the user's partition.

     No system here needs a BIOS. That was the rule for the list: Sega CD,
     Famicom Disk System, Lynx, ColecoVision, MSX, Intellivision, Neo Geo,
     arcade and PSX all want files the project can neither ship nor verify,
     and they wait for the milestone that builds /relicos/bios properly. -->
<systemList>
  <system>
    <name>atari2600</name>
    <fullname>Atari 2600</fullname>
    <path>/relicos/roms/atari2600</path>
    <extension>.a26 .bin .A26 .BIN</extension>
    <command>/usr/bin/relicos-launch stella %ROM% %CONTROLLERSCONFIG%</command>
    <platform>atari2600</platform>
    <theme>atari2600</theme>
  </system>
  <system>
