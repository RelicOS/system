# RelicOS path map (M12). Read by es-core Paths::loadCustomConfiguration
# from the executable's own directory -- so it lives on the immutable
# rootfs, is versioned with the system and replaced by an update, and the
# user cannot break it. Two rules from the source, both load-bearing:
#   - it is only found if argv[0] is absolute (relicos-menu launches
#     /usr/bin/emulationstation, not "emulationstation");
#   - a key is ignored unless its value is an EXISTING directory, which is
#     why S00storage creates the /relic side before the menu starts.
# Left at their defaults on purpose: root (= /data) and log
# (= /data/system/.emulationstation).
# music: the ES plays whatever it finds there as menu background music
# (audio.bgmusic is on by default in this lineage). The image ships no
# tracks -- M13 used two bench WAVs here to prove the audio stack, then
# removed them (Tiago, 2026-09-03: no background music in the product).
# timezones: the folder the ES lists in its TIME ZONE menu (ApiSystem::
# getTimezones walks the continents under it). Unset in a standalone
# build, and the menu entry only appears when it is a directory that
# exists -- tzdata puts it there. The choice itself goes through
# /usr/bin/relicos-timezone (knulli-timezone, the name the ES calls, is a
# symlink to it).
timezones=/usr/share/zoneinfo
system.themes=/usr/share/emulationstation/themes
themes=/relic/themes
music=/relic/music
saves=/relic/saves
screenshots=/relic/screenshots
