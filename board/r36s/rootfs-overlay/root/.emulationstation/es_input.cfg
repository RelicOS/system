<?xml version="1.0"?>
<!-- RelicOS M10: pre-seeded mapping for the analog sticks ONLY.
     The ES's controller configurator selects a device by pressing a BUTTON
     (GuiDetectDevice accepts TYPE_BUTTON/TYPE_KEY), and on this unit the
     sticks are their own button-less SDL joystick (adc-joystick), separate
     from gpio-keys -- the UI cannot reach it. So the four axes are seeded
     here and the sticks are proven by menu navigation instead.

     Matching: the ES falls back to deviceName-only matching when the GUID
     differs (InputManager::tryLoadInputConfig). The GUID below is the real
     one this unit's sdl2-diag printed on the first M10 card (the name-only
     fallback was also observed working on that same boot). Axis ids
     follow SDL's ascending-ABS-code order for ABS_X/Y/RX/RY (0..3), and
     value=-1 means "left/up = falling values" -- the evdev convention the
     M8 field note measured on this unit. The rootfs is rw (ADR 0009): if
     the diag disagrees, edit here over serial and relaunch, no new card.

     gpio-keys (the 19 buttons) is deliberately absent: mapping it through
     the ES configurator IS the milestone's input test. -->
<inputList>
  <inputConfig type="joystick" deviceName="adc-joystick" deviceGUID="190011526164632d6a6f797374696300">
    <input name="joystick1left" type="axis" id="0" value="-1" />
    <input name="joystick1up"   type="axis" id="1" value="-1" />
    <input name="joystick2left" type="axis" id="2" value="-1" />
    <input name="joystick2up"   type="axis" id="3" value="-1" />
  </inputConfig>
</inputList>
