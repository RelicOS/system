<?xml version="1.0"?>
<!-- RelicOS M10: the minimal system list that makes the menu exist.
     The ES discards any system with zero matching files and errors out with
     none left, so the dummy system points at one .txt shipped in the overlay.
     "Launching" it runs /bin/true and returns to the menu, which makes the
     launch/return cycle a free observation. Real systems arrive with the
     emulator milestone. -->
<systemList>
  <system>
    <name>dummy</name>
    <fullname>RelicOS M10 test system</fullname>
    <path>/root/roms/dummy</path>
    <extension>.txt</extension>
    <command>/bin/true</command>
    <platform>pc</platform>
    <theme>default</theme>
  </system>
</systemList>
