# RelicOS bluetoothd configuration (M22 part 3). Buildroot's bluez5_utils
# installs no main.conf; this one sets the two things a handheld wants:
# the adapter powered as soon as bluetoothd finds it (so relicos-bluetooth
# never has to say "power on"), and a name the player recognises on the
# other side of a pairing. Everything else is bluetoothd's default.
[General]
Name = RelicOS
# Both radios (BR/EDR for older pads and most headsets, LE for the Xbox
# Series and other BLE pads), re-pairing without a prompt when a pad that
# forgot us comes back (Just Works has nothing to confirm anyway), and the
# fast-connectable page scan that lets a pad reconnect on the first try.
# The same three lines Batocera ships.
# Classic only (M22 build 26). With "dual" the adapter advertises LE and
# an Xbox pad with 5.x firmware came back over LE after a reconnect: a
# second identity (product 02e0 instead of 02fd, another button layout,
# another GUID, so another es_input.cfg entry and another settings
# page), and a game where no button but the menu toggle answered. The
# scan list also filled with LE beacons no phone shows. BLE-only pads
# are out for now; the day one matters, this is the line to revisit.
ControllerMode = bredr
JustWorksRepairing = always
FastConnectable = true
# The one that made pairing "succeed" and vanish (M22, build 16's HCI
# trace): bluetoothd 5.79 never turns the adapter Bondable on its own --
# it expects an agent or a Pairable property write to do it (Batocera's
# Python agent does) -- so our IO capability reply said "No Bonding", the
# kernel stored the pad's link key with "Store hint: No", and the pad was
# unpaired a second after "Pairing successful". Bondable from the start,
# always: this console pairs on demand and nothing else uses the radio.
AlwaysPairable = true

[Policy]
AutoEnable = true
