# RAUC system configuration (M25). What this console is, where its slots
# are, how its bootloader is told which one to boot.
#
# compatible: the string every bundle must repeat in its manifest, or RAUC
# refuses it -- a bundle built for another device never reaches a slot.
# bootloader=uboot: RAUC speaks to U-Boot through fw_printenv/fw_setenv
# (libubootenv, /etc/fw_env.config -> /run/fw_env.config from S00storage):
# after an install it sets BOOT_ORDER="<new> <old>" and BOOT_<new>_LEFT=3,
# `rauc status mark-good` sets BOOT_<booted>_LEFT=3 -- the very variables
# the chooser in U-Boot's default environment reads (patches/uboot/0004).
# Which slot is booted comes from rauc.slot= on the kernel command line,
# put there by the slot's boot.scr.
# statusfile: what RAUC remembers about each slot (installed version, when,
# outcome). Journaled system state, so /data (S00storage creates the dir).
# mountprefix: where RAUC mounts the bundle while it installs. The
# default is /mnt/rauc, and RAUC creates the mount point itself -- on an
# erofs root that is "Read-only file system" and the install stops right
# after the signature check (Build 2, ladder step 3). /run is the tmpfs.
[system]
compatible=relicos-r36s
bootloader=uboot
statusfile=/data/rauc/central.raucs
bundle-formats=verity
mountprefix=/run/rauc

# The certificate that signed the bundles this console accepts. The
# matching private key lives on the build PC (system/secrets/, never in
# git or on the card). Replacing this file is itself an update.
[keyring]
path=/etc/rauc/keyring.pem

# Two slots, a and b, each a boot partition (kernel + DTB + boot.scr, FAT)
# and a root partition (erofs) -- a matched pair (ADR 0007), so the boot
# slot is a child of its rootfs slot and both are written together.
# type=raw: the image file is written onto the whole partition, the
# "whole-partition write" the layout was designed for. Devices by the
# names S00storage gives them: /dev/mmcblkN is not stable (two SD slots)
# and PARTUUIDs are the same on every RelicOS card (pinned).
[slot.rootfs.0]
device=/dev/relicos/root_a
type=raw
bootname=a

[slot.boot.0]
device=/dev/relicos/boot_a
type=raw
parent=rootfs.0

[slot.rootfs.1]
device=/dev/relicos/root_b
type=raw
bootname=b

[slot.boot.1]
device=/dev/relicos/boot_b
type=raw
parent=rootfs.1
