# RelicOS ALSA routing (M13). Without this file alsa-lib's "default" for a
# card with no config of its own is plughw: format conversion in front of
# the raw device, ONE client at a time -- a bench speaker-test next to the
# running menu fails with -16 EBUSY (measured, m13-som-2121). ROCKNIX and
# Knulli answer that with a sound server (PipeWire); for a BusyBox that
# boots to the menu in 12 s the plain-ALSA answer of the ArkOS/EmuELEC
# lineage is this file:
#   - plug: convert whatever a client opens (the ES's SDL_mixer at 44.1 kHz
#     stereo, a mono speaker-test, an emulator later) to one format;
#   - dmix: mix clients in software at the codec's native 48000/S16/stereo,
#     so more than one may play at once.
# Slave sizes are explicit so latency is a number: 1024 frames per period
# (21 ms), 8192-frame ring (171 ms) -- room for the SDL client's 4096-frame
# periods. dmix's shared state is a SysV IPC segment, not a file: fine on
# the read-only rootfs.

pcm.!default {
	type plug
	slave.pcm "dmixer"
}

pcm.dmixer {
	type dmix
	ipc_key 1024
	slave {
		pcm "hw:0,0"
		channels 2
		rate 48000
		format S16_LE
		period_size 1024
		buffer_size 8192
	}
}

# The mixer side: the ES's VolumeControl opens ctl "default" to reach
# Master. Card 0 explicitly.
ctl.!default {
	type hw
	card 0
}
