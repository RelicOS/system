# SD card layout for the R36S.
#
# The RK3326 BootROM reads the second-stage loader from sector 64 (32 KiB).
# The first partition starts at 16 MiB — more than we need, but it matches the
# known-good Knulli layout, and leaves room for the vendor fallback chain
# (uboot.img at 4 MiB, trust.img at 8 MiB) without moving any partition.
#
# The FAT partition with RELICOS.TXT is the device-side proof that the card
# was really written: at the U-Boot prompt, "part list mmc 1" must show this
# table and "load mmc 1:1 0x02000000 RELICOS.TXT" must read the file.

image boot.vfat {
	vfat {
		extraargs = "-F 32 -n RELICOS"
		files = { "RELICOS.TXT", "boot.scr", "relicos.env",
			  "Image", "rk3326-r36s.dtb" }
	}
	# 160M: the raw (uncompressed) Image alone is ~45 MB, and this leaves
	# room for the panel overlays of the display milestone. Same order of
	# magnitude as the ~64 MB that ADR 0007 reserves for boot_A.
	size = 160M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-rockchip.bin"
		offset = 32K
	}

	partition boot {
		partition-type = 0xC
		image = "boot.vfat"
		offset = 16M
	}
}
