# SD card layout for the R36S — the definitive map (M12): GPT, 6 partitions.
#
# GPT because the map needs six partitions (MBR tops out at 4 primaries):
# ADR 0004/0007 require boot A/B — kernel, DTB and boot.scr are a matched
# pair with their rootfs, so each slot carries its own — plus the private
# ext4 `data` for system state and the FAT32 `RELIC` the user writes from
# any PC. The GPT lives in LBA 1–33; the RK3326 BootROM reads the
# second-stage loader from sector 64 (32 KiB) — no collision. The first
# partition still starts at 16 MiB, matching the known-good Knulli layout
# and leaving room for the vendor fallback chain (uboot.img at 4 MiB,
# trust.img at 8 MiB).
#
# GPT type UUIDs are what keep Windows honest without hacks: `xbootldr` and
# `L` (linux) are not "basic data", so Windows assigns no drive letter and
# offers no format for boot, system and state. Only RELIC (type `F`) shows
# up in the Explorer, by that name.
#
# Every UUID is PINNED (genimage would otherwise roll dice, and root= on
# the kernel command line depends on them). Scheme: group 1 spells "RELI",
# group 2 is the role (0001 boot, 0002 root, 0003 data, 0004 relic), the
# last digit is the slot (a/b).
#
# End of map: 3344 MiB + backup GPT ⇒ any 4 GB card fits.

image boot.vfat {
	vfat {
		label = "RELICOS_A"
		extraargs = "-F 32"
		files = { "RELICOS.TXT", "boot.scr", "Image",
			  "rk3326-r36s.dtb", "rk3326-r36s-nopanel.dtb" }
	}
	# 128M: the raw Image is ~45 MB; room for both DTBs and future panel
	# overlays. relicos.env moved to RELIC (it is a USER override — it has
	# to survive an update, and boot_a does not).
	size = 128M
}

# The user's contact surface. Born populated at build time: this is the
# only partition an ordinary PC -- Windows included -- will mount, so its
# folder structure has to exist before the card is ever booted.
# post-image.sh copies board/r36s/relic/ into BINARIES_DIR; the vfat
# handler copies directories recursively (mcopy -sp).
image relic.vfat {
	vfat {
		label = "RELIC"
		extraargs = "-F 32"
		files = { "relic/README.TXT", "relic/relicos.env",
			  "relic/roms", "relic/overlays", "relic/update" }
	}
	size = 1024M
}

# System state the user never touches. Ships EMPTY on purpose: seeding it
# on first boot (S00storage) is the contract this milestone has to
# exercise. mke2fs comes from host-e2fsprogs (explicit in the defconfig
# now that no ext2 rootfs pulls it in).
image data.ext4 {
	empty = true
	ext4 {
		use-mke2fs = true
		label = "relicos-data"
	}
	size = 512M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "52454c49-0000-0000-0000-000000000000"
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-rockchip.bin"
		offset = 32K
	}

	# boot_a stays partition 1, so the U-Boot CONFIG_BOOTCOMMAND
	# ("load mmc 0:1 ...") from uboot.fragment keeps working unchanged —
	# U-Boot is not rebuilt in this milestone. Choosing between slots is
	# the updater's job (M15), not the table's.
	partition boot_a {
		image = "boot.vfat"
		offset = 16M
		partition-type-uuid = "xbootldr"
		partition-uuid = "52454c49-0001-0000-0000-00000000000a"
	}

	# Slot B: genuinely reserved space, no filesystem — the OTA writes
	# the whole partition. Size must equal its A twin: if one day the
	# image does not fit, there is no update.
	partition boot_b {
		offset = 144M
		size = 128M
		partition-type-uuid = "xbootldr"
		partition-uuid = "52454c49-0001-0000-0000-00000000000b"
	}

	# 768M per root slot: the erofs measures ~330–360 MiB today, but the
	# slot has to fit the largest FUTURE image (M14 adds RetroArch +
	# cores). ~2× headroom, drawn once. Stop rule lives in the plan: a
	# rootfs.erofs above 460 MiB (60%) stops the milestone before any
	# card is written.
	partition root_a {
		image = "rootfs.erofs"
		offset = 272M
		size = 768M
		partition-type-uuid = "L"
		partition-uuid = "52454c49-0002-0000-0000-00000000000a"
	}

	partition root_b {
		offset = 1040M
		size = 768M
		partition-type-uuid = "L"
		partition-uuid = "52454c49-0002-0000-0000-00000000000b"
	}

	partition data {
		image = "data.ext4"
		offset = 1808M
		partition-type-uuid = "L"
		partition-uuid = "52454c49-0003-0000-0000-000000000000"
	}

	partition relic {
		image = "relic.vfat"
		offset = 2320M
		partition-type-uuid = "F"
		partition-uuid = "52454c49-0004-0000-0000-000000000000"
	}
}
